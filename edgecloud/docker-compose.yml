version: '3.8'

services:
  edge-ml-service:
    build:
      context: ..
      dockerfile: edgecloud/Dockerfile
    container_name: edgesense_local_ml
    command: python ml_service.py
    environment:
      SERVICE_LOCATION: ${SERVICE_LOCATION:-LOCAL_EDGE}
      PORT: ${PORT:-8001}
    ports:
      - "${PORT:-8001}:${PORT:-8001}"
    deploy:
      resources:
        limits:
          cpus: '0.50'     # Limit to 0.5 CPU core to simulate Edge Hardware
          memory: 512M

  edgesense-engine:
    build:
      context: ..
      dockerfile: edgecloud/Dockerfile
    container_name: edgesense_engine
    command: python decision_engine.py
    network_mode: "host"   # Allows monitoring host network interfaces
    environment:
      CLOUD_URL: ${CLOUD_URL:-http://20.204.11.46:8002/predict}
      LOCAL_EDGE_URL: ${LOCAL_EDGE_URL:-http://localhost:8001/predict}
    depends_on:
      - edge-ml-service